<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Armada - Saraya</title>

  <!-- BOOTSTRAP & ICONS -->
   <link rel="icon" href="assets/img/logo_saraya.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary: #86B817;
      --secondary: #FE8800;
      --light: #F5F5F5;
      --dark: #14141F;
      --gold: #D4AF37;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      font-family: Helvetica, 'Montserrat', Arial, sans-serif;
      padding-top: 100px;
      overflow-x: hidden;
    }

    /* === NAVBAR === */
    .navbar {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(134, 184, 23, 0.1);
      transition: all 0.3s ease;
    }

    .navbar-brand img {
      width: 70px;
      height: auto;
      transition: transform 0.3s ease;
    }

    .navbar-brand img:hover {
      transform: scale(1.05);
    }

    .btn-home {
      background: linear-gradient(135deg, var(--primary), #9cd423);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(134, 184, 23, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-home::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn-home:hover::before {
      left: 100%;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(134, 184, 23, 0.4);
    }

    /* === MAIN CONTAINER === */
    main.container {
      padding: 60px 0 80px;
      max-width: 1400px;
    }

    /* === HERO TITLE === */
    .hero-title {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
    }

    .hero-title h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 3.5rem;
      background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-bottom: 15px;
      animation: fadeInDown 0.8s ease;
      position: relative;
    }

    .hero-title h1::before {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      z-index: -1;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {

      0%,
      100% {
        opacity: 0;
        transform: translateX(-2px) translateY(-2px);
      }

      50% {
        opacity: 0.3;
        transform: translateX(2px) translateY(2px);
      }
    }

    .hero-title p {
      color: #666;
      font-size: 1.1rem;
      font-weight: 300;
      animation: fadeInUp 0.8s ease 0.2s backwards;
    }

    .hero-title::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      margin: 20px auto 0;
      border-radius: 10px;
      animation: fadeIn 0.8s ease 0.4s backwards;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* === SWITCH BUTTON === */
    .list-group-armada {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .list-group-armada button {
      cursor: pointer;
      background: white;
      border: 2px solid transparent;
      color: var(--dark);
      padding: 14px 38px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .list-group-armada button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #9cd423);
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      z-index: 0;
    }

    .list-group-armada button span {
      position: relative;
      z-index: 1;
    }

    .list-group-armada button:hover::before {
      width: 300px;
      height: 300px;
    }

    .list-group-armada button:hover {
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(134, 184, 23, 0.3);
    }

    .list-group-armada button.active {
      background: linear-gradient(135deg, var(--primary), #9cd423);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 8px 30px rgba(134, 184, 23, 0.4);
      transform: translateY(-3px);
    }

    .list-group-armada button.active::before {
      width: 300px;
      height: 300px;
    }

    /* === ARMADA DETAIL === */
    .armada-detail {
      background: white;
      padding: 60px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      transition: opacity 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    .armada-detail::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(134, 184, 23, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .armada-image-wrapper {
      position: relative;
      margin-bottom: 40px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
    }

    .armada-image-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.9), transparent);
    }

    .armada-detail img.main-image {
      max-width: 100%;
      border-radius: 20px;
      transition: transform 0.5s ease;
    }

    .armada-image-wrapper:hover img.main-image {
      transform: scale(1.05);
    }

    .armada-detail h3 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      color: var(--dark);
      margin: 30px 0 20px;
      font-size: 2.5rem;
      letter-spacing: -0.5px;
    }

    .armada-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--secondary), #ff9d33);
      color: white;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(254, 136, 0, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(254, 136, 0, 0.3);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(254, 136, 0, 0.5);
      }
    }

    .armada-detail p.description {
      color: #555;
      line-height: 1.9;
      text-align: justify;
      font-size: 1.05rem;
      font-weight: 400;
      margin: 25px 0;
    }

    /* === FASILITAS === */
    .fasilitas-section {
      margin-top: 50px;
    }

    .fasilitas-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--dark);
      font-size: 1.8rem;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .fasilitas-title::before,
    .fasilitas-title::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }

    .fasilitas-title::before {
      right: 60%;
      margin-right: 20px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }

    .fasilitas-title::after {
      left: 60%;
      margin-left: 20px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }

    .fasilitas-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
      border-radius: 15px;
      padding: 18px 22px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
      border: 2px solid transparent;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .fasilitas-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary), #9cd423);
      transition: left 0.4s ease;
      z-index: 0;
    }

    .fasilitas-item:hover::before {
      left: 0;
    }

    .fasilitas-item:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(134, 184, 23, 0.25);
    }

    .fasilitas-item i {
      font-size: 1.6rem;
      color: var(--primary);
      transition: all 0.4s ease;
      position: relative;
      z-index: 1;
    }

    .fasilitas-item span {
      font-weight: 500;
      color: var(--dark);
      transition: all 0.4s ease;
      position: relative;
      z-index: 1;
    }

    .fasilitas-item:hover i,
    .fasilitas-item:hover span {
      color: white;
    }

    /* === INTERIOR EKSTERIOR === */
    .interior-eksterior {
      margin-top: 70px;
      padding-top: 50px;
      border-top: 2px solid #eee;
    }

    .interior-eksterior h5 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 30px;
      font-size: 1.8rem;
      position: relative;
      padding-bottom: 15px;
    }

    .interior-eksterior h5::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
    }

    .gallery-item {
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15);
    }

    .gallery-item img {
      border-radius: 15px;
      width: 100%;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .gallery-item p {
      margin-top: 15px;
      color: #666;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
      padding: 0 5px;
    }

    /* === CTA BUTTON === */
    .cta-section {
      margin-top: 60px;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, rgba(134, 184, 23, 0.05), rgba(254, 136, 0, 0.05));
      border-radius: 20px;
    }

    .cta-text {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 25px;
      font-family: 'Playfair Display', serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #9cd423);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 50px;
      padding: 16px 50px;
      font-size: 1.1rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 25px rgba(134, 184, 23, 0.3);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s ease;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--secondary), #ff9d33);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(254, 136, 0, 0.4);
    }

    .btn-primary i {
      margin-left: 8px;
      transition: transform 0.3s ease;
    }

    .btn-primary:hover i {
      transform: translateX(5px);
    }

    /* === FOOTER === */
    footer {
      background: linear-gradient(135deg, var(--dark) 0%, #1a1a2e 100%);
      color: #bbb;
      padding: 30px 0;
      margin-top: 80px;
      border-top: 3px solid var(--primary);
    }

    footer p {
      margin-bottom: 0;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .hero-title h1 {
        font-size: 2.5rem;
      }

      .armada-detail {
        padding: 30px 20px;
      }

      .armada-detail h3 {
        font-size: 2rem;
      }

      .list-group-armada button {
        width: 100%;
        max-width: 300px;
      }

      .btn-primary {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 576px) {
      body {
        padding-top: 90px;
      }

      main.container {
        padding: 40px 0;
      }

      .hero-title h1 {
        font-size: 2rem;
      }

      .armada-detail h3 {
        font-size: 1.8rem;
      }

      .fasilitas-title::before,
      .fasilitas-title::after {
        display: none;
      }
    }

    /* === FLOATING WHATSAPP === */
    .floating-whatsapp {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #25d366, #20ba5a);
      color: white;
      border-radius: 50%;
      text-align: center;
      font-size: 32px;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 9999;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s ease-in-out infinite;
    }

    .floating-whatsapp::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(37, 211, 102, 0.3);
      animation: ripple 1.5s ease-out infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .floating-whatsapp:hover {
      background: linear-gradient(135deg, #20ba5a, #1da851);
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
    }

    .floating-whatsapp i {
      position: relative;
      z-index: 1;
    }

    /* === STATS COUNTER (Optional Enhancement) === */
    .stats-section {
      display: flex;
      justify-content: space-around;
      padding: 40px 0;
      background: linear-gradient(135deg, rgba(134, 184, 23, 0.05), rgba(254, 136, 0, 0.05));
      border-radius: 20px;
      margin: 40px 0;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      color: #666;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* === SCROLL TO TOP === */
    .scroll-top {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, var(--primary), #9cd423);
      color: white;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(134, 184, 23, 0.3);
      transition: all 0.3s ease;
      z-index: 9998;
    }

    .scroll-top:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 25px rgba(134, 184, 23, 0.5);
    }

    .scroll-top.show {
      display: flex;
    }

    /* === COMPARISON TOOL === */
    .comparison-section-inline {
      margin-top: 70px;
      padding-top: 50px;
      border-top: 2px solid #eee;
    }

    .comparison-section {
      margin: 60px 0;
      padding: 50px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .comparison-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(134, 184, 23, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .comparison-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .comparison-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
    }

    .comparison-subtitle {
      color: #666;
      font-size: 1.05rem;
      font-weight: 300;
    }

    .comparison-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(134, 184, 23, 0.05), rgba(254, 136, 0, 0.05));
      border-radius: 20px;
    }

    .comparison-toggle-text {
      font-weight: 600;
      color: var(--dark);
      font-size: 1.1rem;
    }

    .toggle-switch {
      position: relative;
      width: 70px;
      height: 35px;
      background: #ddd;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid var(--primary);
    }

    .toggle-switch.active {
      background: linear-gradient(135deg, var(--primary), #9cd423);
    }

    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 27px;
      height: 27px;
      background: white;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .toggle-switch.active .toggle-slider {
      transform: translateX(35px);
    }

    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .comparison-table thead th {
      background: linear-gradient(135deg, var(--primary), #9cd423);
      color: white;
      padding: 20px;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .comparison-table thead th:first-child {
      border-radius: 15px 0 0 0;
      text-align: left;
      padding-left: 30px;
    }

    .comparison-table thead th:last-child {
      border-radius: 0 15px 0 0;
    }

    .comparison-table tbody tr {
      transition: all 0.3s ease;
    }

    .comparison-table tbody tr:hover {
      background: rgba(134, 184, 23, 0.05);
      transform: scale(1.01);
    }

    .comparison-table tbody tr:hover td:first-child {
      color: var(--primary);
      font-weight: 700;
    }

    .comparison-table tbody tr:hover .comparison-icon {
      transform: scale(1.2);
      transition: transform 0.3s ease;
    }

    .comparison-table tbody td {
      padding: 20px;
      border-bottom: 1px solid #eee;
      text-align: center;
      vertical-align: middle;
      transition: all 0.3s ease;
    }

    .comparison-table tbody td:first-child {
      font-weight: 600;
      color: var(--dark);
      text-align: left;
      padding-left: 30px;
      width: 35%;
    }

    .comparison-table tbody tr:last-child td {
      border-bottom: none;
    }

    .comparison-value {
      font-size: 1.05rem;
      color: #555;
      font-weight: 500;
    }

  <script>
    document.addEventListener("click", function (e) {
      const toggle = e.target.closest("#comparisonToggle");
      if (!toggle) return; // kalau bukan klik di tombol toggle, abaikan

      const content = document.getElementById("comparisonContent");
      if (!content) return;

      toggle.classList.toggle("active");
      const isActive = toggle.classList.contains("active");
      content.style.display = isActive ? "block" : "none";

      if (isActive) {
        setTimeout(() => {
          content.scrollIntoView({ behavior: "smooth", block: "nearest" });
          if (window.AOS) AOS.refresh();
        }, 100);
      }
    });
